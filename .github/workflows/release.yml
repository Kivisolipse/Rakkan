# Push a tag that matches the version in manifest.json (`npm version patch`
# makes both) to build the plugin and attach it to a draft release.
name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          # The release notes list the commits since the previous tag.
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: npm

      - name: Check the tag against manifest.json
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(node -p 'require("./manifest.json").version')"
          [ "$tag" = "$version" ] || { echo "Tag $tag does not match manifest.json version $version"; exit 1; }
          node -e 'const v = require("./versions.json"); if (!v[process.argv[1]]) process.exit(1)' "$version" || { echo "versions.json has no entry for $version"; exit 1; }

      - name: Build plugin
        run: |
          npm ci
          npm test
          npm run build

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # Every commit since the previous tag, but the version bump itself.
          prev="$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)"
          git log --no-merges --format='- %s' "${prev:+$prev..}$tag" | grep -v '^- chore: release ' > notes.md || true

          gh release create "$tag" \
            --title="$tag" \
            --notes-file notes.md \
            --draft \
            main.js manifest.json styles.css
